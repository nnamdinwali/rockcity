<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #07140c; }
      #root { min-height: 100dvh; }
      .rockcity-boot { min-height: 100dvh; display: grid; place-items: center; color: #f2fff5; font: 600 16px/1.5 Inter, system-ui, sans-serif; }
      .rockcity-boot-card { padding: 28px; text-align: center; }
      .rockcity-boot-dot { width: 40px; height: 40px; margin: 0 auto 16px; border-radius: 999px; background: rgba(57,227,107,.3); animation: rockcity-pulse 1.2s ease-in-out infinite; }
      @keyframes rockcity-pulse { 50% { transform: scale(1.12); opacity: .65; } }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Rock City</title>
    <meta name="description" content="Rock City — a player-powered arcade for focused sessions and visible progress." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Rock City" />
    <meta property="og:description" content="Rock City — a player-powered arcade for focused sessions and visible progress." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rock City" />
    <meta name="twitter:description" content="Rock City — a player-powered arcade for focused sessions and visible progress." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div class="rockcity-boot" role="status" aria-live="polite">
        <div class="rockcity-boot-card"><div class="rockcity-boot-dot" aria-hidden="true"></div><div>Loading Rock City…</div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
