name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORT: '5000'
      BASE_PATH: /rockcity/
      ADMIN_BASE_PATH: /rockcity/admin/
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_APP_ID: Cp623UB2atBZci58ThtrZQ
      VITE_OAUTH_PORTAL_URL: https://manus.im
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @workspace/gamezone run build
      - run: PORT=5174 BASE_PATH=${ADMIN_BASE_PATH} VITE_API_URL=${VITE_API_URL} pnpm --filter @workspace/admin run build
      # SPA fallbacks for both the player site and the separate admin app.
      - run: cp artifacts/gamezone/dist/public/index.html artifacts/gamezone/dist/public/404.html
      - run: mkdir -p artifacts/gamezone/dist/public/admin
      - run: cp artifacts/admin/dist/index.html artifacts/gamezone/dist/public/admin/index.html
      - run: cp artifacts/admin/dist/index.html artifacts/gamezone/dist/public/admin/404.html
      - run: cp -R artifacts/admin/dist/assets artifacts/gamezone/dist/public/admin/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/gamezone/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
